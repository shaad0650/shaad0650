name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots starts at zero contributions, followed by four activity levels.
          # Keep the dark empty cell slate-visible against GitHub's dark background.
          outputs: |
            dist/snake.svg?color_snake=%230891B2&color_dots=%23F4F7FB,%23D1FAE5,%236EE7B7,%2310B981,%23047857
            dist/snake-dark.svg?color_snake=%2322D3EE&color_dots=%232D3343,%23353D54,%23504980,%237A67C7,%23A78BFA

      - name: Publish snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
